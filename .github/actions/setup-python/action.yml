name: Setup Python
description: >-
  Python plus this package's development dependencies, with the cache wired up.
  Written once because a dozen workflows need the same four steps, and four
  steps copied a dozen times drift into a dozen different four steps.

inputs:
  python-version:
    description: The interpreter version.
    required: false
    default: "3.12"
  install:
    description: >-
      Install the package and its dev extra. Set to "false" for a job that only
      needs an interpreter - a linter over the workflow files, say.
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}
        cache: pip
        cache-dependency-path: python/pyproject.toml

    - if: inputs.install == 'true'
      shell: bash
      working-directory: python
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"
