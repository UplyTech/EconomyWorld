name: Lock threads

# Closed threads get locked eventually.
#
# Not to silence anybody: a comment under a thread closed a year ago reaches
# nobody. It lands in no view anybody reads, and the person waits for an answer
# that is not coming. A new thread linking to the old one gets read.

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lock:
    name: Lock
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
      discussions: write
    steps:
      - uses: dessant/lock-threads@v6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          issue-inactive-days: 180
          pr-inactive-days: 90
          issue-comment: |
            This issue has been closed for six months and is now locked.

            That is not a rejection: a comment here reaches nobody. If the same
            problem comes back, a new issue linking to this one is the way it
            gets read.
          pr-comment: |
            This pull request has been closed for three months and is now
            locked. A new issue linking to this one will be read.
          # Anything security-related stays open for follow-up questions.
          exclude-issue-created-before: ""
          exclude-any-issue-labels: "security,pinned,keep-active"
          add-issue-labels: "no-activity"
          process-only: "issues, prs"
