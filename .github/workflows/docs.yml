name: Docs

# Documentation that is wrong is worse than none: dead links, misspelt
# identifiers and README examples that no longer run.
#
# Runs on the own runner, which is root-equivalent on the host (Docker socket).
# Pull requests are therefore not validated automatically: code from a branch,
# Dependabot included, must not run there before a human has read and merged it.
# Validation happens on main after the merge. Tools run in pinned official images
# (see .github/scripts/ci-docker.sh); the host has no node, python or java.

on:
  push:
    branches: [main]
  schedule:
    # A link dies without anybody here changing anything.
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  links:
    name: Links
    runs-on: [self-hosted, server-main]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Dead links
        run: |
          bash .github/scripts/ci-docker.sh node:22-bookworm-slim . <<'SH'
          for f in $(find . -name '*.md' -not -path '*/node_modules/*' -not -path './.ci-tmp/*'); do
            npx --yes markdown-link-check@3.15.0 -q -c .github/markdown-link-check.json "$f"
          done
          SH

  spelling:
    name: Spelling
    runs-on: [self-hosted, server-main]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: cspell
        run: |
          bash .github/scripts/ci-docker.sh node:22-bookworm-slim . <<'SH'
          npx --yes cspell@10.4.0 --config .github/cspell.json --no-progress --show-suggestions "**"
          SH

  examples:
    name: The README examples still hold
    runs-on: [self-hosted, server-main]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build tool image
        run: docker build -q -t ci-polyglot:local .github/ci

      - name: Every imported name exists
        run: |
          bash .github/scripts/ci-docker.sh ci-polyglot:local . <<'SH'
          (cd typescript && npm ci && npm run build)
          (cd python && pip install -e .)
          node .github/scripts/check-docs.mjs
          SH
