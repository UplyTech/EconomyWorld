name: Dependency review

# A pull request that adds a dependency with a known advisory fails here.
# Public repository: runs on GitHub-hosted runners (free for public repositories;
# the organisation runner serves private repositories only). Pull
# requests are validated with a read-only token and without secrets; there is
# no pull_request_target anywhere. Tools run in pinned official images (see
# .github/scripts/ci-docker.sh).

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  review:
    name: Review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
