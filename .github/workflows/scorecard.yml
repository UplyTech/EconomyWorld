name: Scorecard

# OpenSSF Scorecard on the own runner, from the official image. The JSON result
# is kept as an artefact. No SARIF upload (that needs GitHub Advanced Security on
# private repositories) and no public badge (the Scorecard badge API serves
# public repositories only).
#
# Runs on the own runner, which is root-equivalent on the host (Docker socket).
# Pull requests are therefore not validated automatically: code from a branch,
# Dependabot included, must not run there before a human has read and merged it.
# Validation happens on main after the merge. Tools run in pinned official images
# (see .github/scripts/ci-docker.sh); the host has no node, python or java.

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analysis:
    name: Analysis
    runs-on: [self-hosted, server-main]
    timeout-minutes: 20
    steps:
      - name: Run Scorecard
        env:
          GITHUB_AUTH_TOKEN: ${{ github.token }}
        run: |
          docker run --rm -e GITHUB_AUTH_TOKEN gcr.io/openssf/scorecard:v5.2.1 \
            --repo=github.com/${{ github.repository }} --format=json > scorecard.json
          head -c 2000 scorecard.json | head -n 12

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-results
          path: scorecard.json
          retention-days: 30
