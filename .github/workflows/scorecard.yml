name: Scorecard

# OpenSSF Scorecard.
#
# This is a library other people install. Whatever they can check about it
# before they do so - is it published with provenance, are the actions pinned,
# is the branch protected, is there a security policy - they will check with
# this. Running it here means the answer is known before somebody else finds
# it out.
#
# Deliberately not a required check: several of its criteria are about
# repository settings rather than about code, and a red tick on "branch
# protection" should open a settings page, not block a merge.

on:
  branch_protection_rule:
  schedule:
    - cron: "0 7 * * 1"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analysis:
    name: Analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@v2
        with:
          results_file: scorecard.sarif
          results_format: sarif
          publish_results: true

      - uses: actions/upload-artifact@v4
        with:
          name: scorecard-results
          path: scorecard.sarif
          retention-days: 14

      - uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: scorecard.sarif
          category: scorecard
