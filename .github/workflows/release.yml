name: Release

# One tag, two registries, or neither.
#
# Both editions share one version number and one history. A release happens for
# both at once, or not at all - two editions on different versions would be
# exactly the drift the shared test vectors exist to prevent.
#
# So the shape is: verify everything, build both artefacts, then publish npm and
# PyPI from the same run. `publish-pypi` runs first: both registries refuse a
# re-upload of the same version, so a half-release is recovered by fixing the
# cause and re-running the failed job, never by bumping the version.
#
# Neither registry needs a stored credential beyond the npm token: PyPI uses
# trusted publishing, npm adds provenance.

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release, e.g. v1.2.0"
        required: true
      dry_run:
        description: "Build and check everything, publish nothing"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  verify:
    name: Verify
    uses: ./.github/workflows/ci.yml

  guard:
    name: The tag matches the code
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
      prerelease: ${{ steps.resolve.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Resolve the tag
        id: resolve
        run: |
          tag="${{ inputs.tag }}"
          [ -n "$tag" ] || tag="${GITHUB_REF#refs/tags/}"
          version="${tag#v}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # A tag with a suffix - v2.1.0-rc1 - is a pre-release and must not be
          # offered to anybody as a finished version.
          if [ "$tag" != "${tag%%-*}" ]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: One version everywhere, and it is the tag
        run: node .github/scripts/check-versions.mjs --expect "${{ steps.resolve.outputs.version }}"

      - name: The changelog has an entry for this version
        run: |
          version="${{ steps.resolve.outputs.version }}"
          if ! grep -qF "## [$version]" CHANGELOG.md; then
            echo "::error file=CHANGELOG.md::no '## [$version]' section."
            echo "::error file=CHANGELOG.md::A release without a changelog entry is a release nobody can read."
            exit 1
          fi
          echo "ok - CHANGELOG.md documents $version"

  build:
    name: Build the artefacts
    runs-on: ubuntu-latest
    needs: [verify, guard]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: typescript/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Each artefact carries its own licence and changelog. On a fresh clone
      # the copies do not exist - they are generated and gitignored - so this
      # step is what stops an unlicensed package reaching a registry.
      - name: Generate the per-edition licence and changelog
        run: node .github/scripts/sync-package-files.mjs

      - name: npm package
        working-directory: typescript
        run: |
          npm ci
          npm run build
          npm pack --pack-destination "${{ github.workspace }}/artefacts/npm"

      - name: Python wheel and sdist
        working-directory: python
        run: |
          python -m pip install --upgrade pip build twine
          python -m build --outdir "${{ github.workspace }}/artefacts/pypi"
          python -m twine check "${{ github.workspace }}"/artefacts/pypi/*

      - uses: actions/upload-artifact@v7
        with:
          name: release-artefacts
          path: artefacts/
          retention-days: 30
          if-no-files-found: error

  publish-pypi:
    name: PyPI
    runs-on: ubuntu-latest
    needs: [build, guard]
    if: ${{ !inputs.dry_run }}
    environment:
      name: pypi
      url: https://pypi.org/project/economyworld/${{ needs.guard.outputs.version }}
    permissions:
      # Trusted publishing. No token is stored anywhere.
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-artefacts
          path: artefacts

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: artefacts/pypi
          print-hash: true

  publish-npm:
    name: npm
    runs-on: ubuntu-latest
    needs: [build, guard, publish-pypi]
    if: ${{ !inputs.dry_run }}
    environment:
      name: npm
      url: https://www.npmjs.com/package/@uplytech/economyworld/v/${{ needs.guard.outputs.version }}
    permissions:
      # Provenance. The published package can be traced back to this workflow
      # run and this commit, which is what makes a supply-chain claim checkable
      # rather than a promise in a README.
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-artefacts
          path: artefacts

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: https://registry.npmjs.org

      - name: Publish
        run: npm publish artefacts/npm/*.tgz --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  release:
    name: GitHub release
    runs-on: ubuntu-latest
    needs: [guard, build, publish-pypi, publish-npm]
    if: ${{ always() && !inputs.dry_run && needs.publish-npm.result == 'success' && needs.publish-pypi.result == 'success' }}
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: release-artefacts
          path: artefacts

      - name: Attest the artefacts
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            artefacts/npm/*.tgz
            artefacts/pypi/*

      - name: Cut the changelog section for this version
        run: |
          version="${{ needs.guard.outputs.version }}"
          awk -v v="## [$version]" '
            index($0, v) == 1 { inside = 1; next }
            inside && /^## \[/ { exit }
            inside { print }
          ' CHANGELOG.md > release-notes.md
          echo "ok - $(wc -l < release-notes.md) lines of notes"

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.guard.outputs.tag }}
          prerelease: ${{ needs.guard.outputs.prerelease == 'true' }}
          generate_release_notes: true
          files: |
            artefacts/npm/*.tgz
            artefacts/pypi/*
          body_path: release-notes.md
          append_body: true
