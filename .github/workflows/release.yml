name: Release

# Signed GitHub release, built on the own runner. Nothing is published to npm or
# PyPI: these packages are unpublished, and the only distribution channel is the
# set of signed artefacts on the GitHub release (npm tarball, wheel, sdist,
# SHA256SUMS, provenance.intoto.json, one .sig file per artefact).
#
# The signing key is the organisation secret RELEASE_SIGNING_KEY; the public key
# is release-signing.pub in the repository root. See README, "Security and OpenSSF".

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release, e.g. v1.2.0"
        required: true

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  verify:
    name: Verify
    uses: ./.github/workflows/ci.yml

  release:
    name: Build, sign, release
    runs-on: [self-hosted, server-main]
    needs: verify
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false

      - name: Resolve the tag
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          tag="${INPUT_TAG:-${GITHUB_REF#refs/tags/}}"
          case "$tag" in v[0-9]*) ;; *) echo "::error::'$tag' is not a v* tag"; exit 1 ;; esac
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          case "$tag" in *-*) echo "prerelease=--prerelease" >> "$GITHUB_OUTPUT" ;; *) echo "prerelease=" >> "$GITHUB_OUTPUT" ;; esac

      - name: The signing key is configured
        env:
          KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::secret RELEASE_SIGNING_KEY is empty. It is set at organisation level by the owner; an unsigned release is not created."
            exit 1
          fi

      - name: Build tool image
        run: docker build -q -t ci-polyglot:local .github/ci

      - name: Version and changelog match the tag
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          bash .github/scripts/ci-docker.sh ci-polyglot:local . <<SH
          node .github/scripts/check-versions.mjs --expect "$VERSION"
          grep -qF "## [$VERSION]" CHANGELOG.md || { echo "::error file=CHANGELOG.md::no '## [$VERSION]' section"; exit 1; }
          SH

      - name: Build the artefacts
        run: |
          rm -rf release && mkdir release
          bash .github/scripts/ci-docker.sh ci-polyglot:local . <<'SH'
          node .github/scripts/sync-package-files.mjs
          (cd typescript && npm ci && npm run build && npm pack --pack-destination "$RUNNER_TEMP/../release")
          (cd python && python -m pip install --upgrade pip build twine && python -m build --outdir "$RUNNER_TEMP/../release")
          python -m twine check "$RUNNER_TEMP"/../release/*
          SH

      - name: Checksums and provenance
        run: |
          docker run --rm -v "$PWD:$PWD" -w "$PWD" \
            -e GITHUB_REPOSITORY -e GITHUB_REF -e GITHUB_SHA -e GITHUB_WORKFLOW_REF -e GITHUB_RUN_ID -e GITHUB_RUN_ATTEMPT \
            python:3.12-slim python .github/scripts/release-manifest.py release

      - name: Sign
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          umask 077
          key="${RUNNER_TEMP}/release-signing.key"
          printf '%s\n' "$RELEASE_SIGNING_KEY" > "$key"
          for f in release/*; do
            case "$f" in *.sig) continue ;; esac
            openssl dgst -sha256 -sign "$key" -out "$f.sig.der" "$f"
            base64 -w0 "$f.sig.der" > "$f.sig"
            rm -f "$f.sig.der"
          done
          openssl dgst -sha256 -verify release-signing.pub -signature <(base64 -d release/SHA256SUMS.sig) release/SHA256SUMS

      - name: Remove the key file
        if: always()
        run: rm -f "${RUNNER_TEMP}/release-signing.key"

      - name: Release notes from the changelog
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          awk -v v="## [$VERSION]" 'index($0, v) == 1 { inside = 1; next } inside && /^## \[/ { exit } inside { print }' CHANGELOG.md > release-notes.md

      - name: Create the GitHub release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
          PRERELEASE: ${{ steps.tag.outputs.prerelease }}
        run: |
          docker run --rm -v "$PWD:$PWD" -w "$PWD" -e GITHUB_TOKEN -e GITHUB_REPOSITORY \
            python:3.12-slim python .github/scripts/release-publish.py "$TAG" release release-notes.md $PRERELEASE
