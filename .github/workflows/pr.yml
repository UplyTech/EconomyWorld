name: Pull request

# The checks that are about the pull request rather than about the code.
#
# Everything here is meant to make review cheaper, not to gate merging on
# formatting opinions - so it labels, it sizes, and it says out loud when a
# change touches something the project treats as a release decision.

on:
  pull_request_target:
    types: [opened, reopened, edited, synchronize, ready_for_review]

permissions:
  contents: read

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  title:
    name: Conventional title
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      # The release notes are generated from the merged commits. A pull request
      # called "fixes" produces a release note called "fixes".
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            docs
            test
            refactor
            build
            ci
            chore
            revert
          requireScope: false
          subjectPattern: ^(?![A-Z])(?!.*\.$).+$
          subjectPatternError: |
            The subject "{subject}" should start lowercase and not end in a full stop.

  label:
    name: Label
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/labeler@v5
        with:
          sync-labels: true

  size:
    name: Size
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: codelytv/pr-size-labeler@v1
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          xs_label: "size/xs"
          xs_max_size: "20"
          s_label: "size/s"
          s_max_size: "100"
          m_label: "size/m"
          m_max_size: "400"
          l_label: "size/l"
          l_max_size: "1000"
          xl_label: "size/xl"
          message_if_xl: |
            This pull request changes more than a thousand lines. That is not
            forbidden, but it is worth asking whether it is one change or
            several - a review that cannot be held in one head tends to become
            an approval instead.
          files_to_ignore: "typescript/package-lock.json shared/testcases/*.json"

  release-impact:
    name: Release impact
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      # Deliberately no checkout. This workflow runs on `pull_request_target`,
      # which means it has a writable token - and checking out a fork's head
      # under that token is how a pull request gets to run its own code with
      # the repository's permissions. The file list comes from the API instead.
      - name: What this pull request touches
        id: touched
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          changed=$(gh api \
            "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" \
            --paginate --jq '.[].filename')
          echo "$changed"
          vectors=false
          changelog=false
          echo "$changed" | grep -q '^shared/testcases/.*\.json$' && vectors=true
          echo "$changed" | grep -q '^CHANGELOG\.md$' && changelog=true
          echo "vectors=$vectors" >> "$GITHUB_OUTPUT"
          echo "changelog=$changelog" >> "$GITHUB_OUTPUT"

      - name: A changed vector is a changed behaviour
        if: steps.touched.outputs.vectors == 'true'
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          header: release-impact
          message: |
            ### This pull request changes a shared test vector

            `shared/testcases/` is the contract between the Python and the
            TypeScript edition. A file in it changed, which means the behaviour
            of the library changed.

            Before merging:

            - [ ] the diff in the vector files has been read line by line
            - [ ] `CHANGELOG.md` records what changed
            - [ ] the version bump matches CONTRIBUTING.md

            > Never regenerate the vectors to make a failing test pass. A
            > failing vector is the system working.

      - name: A behaviour change wants a changelog entry
        if: steps.touched.outputs.vectors == 'true' && steps.touched.outputs.changelog == 'false'
        run: |
          echo "::warning::A shared vector changed but CHANGELOG.md did not."
          echo "::warning::Every behaviour change belongs in the changelog with its version bump."
