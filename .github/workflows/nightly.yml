name: Nightly

# What is too slow to run on every push: the next runtime versions, mutation
# testing, and the newest dependencies instead of the locked ones.
#
# Public repository: runs on GitHub-hosted runners (free for public repositories;
# the organisation runner serves private repositories only). Pull
# requests are validated with a read-only token and without secrets; there is
# no pull_request_target anywhere. Tools run in pinned official images (see
# .github/scripts/ci-docker.sh).

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # A break in a pre-release is not a red build, but knowing about it three
  # months before the release is the whole difference.
  future:
    name: ${{ matrix.runtime }} ${{ matrix.version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runtime: python, version: "3.14", image: "python:3.14-slim", dir: python, cmd: 'pip install -e ".[dev]" && pytest -q' }
          - { runtime: node, version: "24", image: "node:24-bookworm-slim", dir: typescript, cmd: "npm ci && npm test" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Tests on the future runtime
        env:
          IMAGE: ${{ matrix.image }}
          DIR: ${{ matrix.dir }}
          CMD: ${{ matrix.cmd }}
        run: |
          bash .github/scripts/ci-docker.sh "$IMAGE" "$DIR" <<SH
          $CMD
          SH

  # Coverage says which line was executed, not whether anybody looked. A
  # surviving mutation is a line that looks tested and is not.
  mutation:
    name: Mutation testing
    runs-on: ubuntu-latest
    timeout-minutes: 90
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: mutmut
        run: |
          bash .github/scripts/ci-docker.sh python:3.12-slim python <<'SH'
          pip install --quiet mutmut
          pip install -e ".[dev]"
          mutmut run --paths-to-mutate src --no-progress || true
          mutmut results
          SH

  # What a caller would install today - with today's dependencies, not the ones
  # in the lockfile.
  fresh-dependencies:
    name: With the newest dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Python without the lockfile
        run: |
          bash .github/scripts/ci-docker.sh python:3.12-slim python <<'SH'
          pip install -e ".[dev]" --upgrade
          pytest -q
          SH

      - name: Node without the lockfile
        run: |
          bash .github/scripts/ci-docker.sh node:22-bookworm-slim typescript <<'SH'
          npm install --no-audit --no-fund
          npm test
          SH
