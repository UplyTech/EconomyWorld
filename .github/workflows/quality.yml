name: Quality

# The checks no test finds: shell scripts, YAML, Markdown, dead code,
# complexity and the workflows themselves.
#
# Public repository: runs on GitHub-hosted runners (free for public repositories;
# the organisation runner serves private repositories only). Pull
# requests are validated with a read-only token and without secrets; there is
# no pull_request_target anywhere. Tools run in pinned official images (see
# .github/scripts/ci-docker.sh).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shell:
    name: Shell scripts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: shellcheck
        run: |
          files=$(git ls-files '*.sh')
          [ -n "$files" ] || { echo "::error::No shell scripts found - then this job checks nothing."; exit 1; }
          # shellcheck disable=SC2086
          docker run --rm -v "$PWD:/mnt" -w /mnt koalaman/shellcheck:v0.10.0@sha256:2097951f02e735b613f4a34de20c40f937a6c8f18ecb170612c88c34517221fb --severity=warning $files

      - name: Every script stops on an error
        run: |
          failed=0
          for file in $(git ls-files '*.sh'); do
            if ! head -12 "$file" | grep -q 'set -euo pipefail'; then
              echo "::error file=$file::no 'set -euo pipefail' in the first twelve lines"
              failed=1
            fi
          done
          exit $failed

  yaml:
    name: YAML
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: yamllint
        run: |
          bash .github/scripts/ci-docker.sh python:3.12-slim@sha256:aa943ce411423c7582288f18707ff66eddcbaeb510502d747a72aeb34f30d159 . <<'SH'
          pip install --quiet yamllint==1.35.1
          yamllint --strict -c .github/yamllint.yaml .github/
          SH

  markdown:
    name: Markdown
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: markdownlint
        run: |
          bash .github/scripts/ci-docker.sh node:22-bookworm-slim@sha256:4b150b48b4116e2a22f2c39cc27025fbf4f153e2078fd3b14d159fdb5c7279da . <<'SH'
          npx --yes markdownlint-cli2@0.23.3
          SH

  # Reported rather than blocking: in a library "not used here" is the normal case.
  dead-code:
    name: Nothing unused
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build tool image
        run: docker build -q -t ci-polyglot:local .github/ci

      - name: knip and vulture
        continue-on-error: true
        run: |
          bash .github/scripts/ci-docker.sh ci-polyglot:local . <<'SH'
          (cd typescript && npm ci && npx --yes knip@5 --config ../.github/knip.jsonc --reporter compact)
          pip install --quiet vulture
          # 80 per cent confidence: below that vulture reports every attribute
          # only reached through getattr, and that is noise.
          (cd python && vulture src tests --min-confidence 80)
          SH

  complexity:
    name: Complexity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Cyclomatic complexity
        run: |
          bash .github/scripts/ci-docker.sh python:3.12-slim@sha256:aa943ce411423c7582288f18707ff66eddcbaeb510502d747a72aeb34f30d159 python <<'SH'
          pip install --quiet radon
          radon cc src --show-complexity --average --order SCORE
          # Grade D is a function nobody can hold in their head any more.
          over=$(radon cc src --min D --json | python -c "import json,sys; d=json.load(sys.stdin); print(sum(len(v) for v in d.values()))")
          if [ "$over" != "0" ]; then
            echo "::error::$over functions at complexity D or worse"
            radon cc src --min D --show-complexity
            exit 1
          fi
          echo "ok - no function above grade C"
          SH

  workflows:
    name: Workflows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Every workflow declares its permissions and a timeout
        run: |
          failed=0
          for file in .github/workflows/*.yml; do
            grep -q '^permissions:' "$file" || { echo "::error file=$file::no top-level permissions: block"; failed=1; }
          done
          exit $failed

      - name: actionlint
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 -color
