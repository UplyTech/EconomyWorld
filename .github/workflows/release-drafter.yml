name: Release drafter

# The release draft is kept up to date continuously.
#
# Whoever starts collecting notes on release day copies out the list of merged
# titles. Whoever keeps them as they go has something on release day that a
# person can read.

on:
  push:
    branches: [main]
  pull_request_target:
    types: [opened, reopened, synchronize, labeled, unlabeled]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  draft:
    name: Update the draft
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: release-drafter/release-drafter@v6
        with:
          config-name: release-drafter.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
