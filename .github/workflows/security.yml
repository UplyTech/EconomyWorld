name: Security

# What "security" means for a library: the supply chain (dependencies, actions,
# committed secrets). The scheduled run matters more than the push run: a new
# advisory almost always concerns a dependency that has not changed.
#
# Public repository: runs on GitHub-hosted runners (free for public repositories;
# the organisation runner serves private repositories only). Pull
# requests are validated with a read-only token and without secrets; there is
# no pull_request_target anywhere. Tools run in pinned official images (see
# .github/scripts/ci-docker.sh).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secrets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The whole history: a token committed three months ago and removed in
          # the next commit is still a valid token.
          fetch-depth: 0
          persist-credentials: false

      - name: gitleaks
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f git /repo --redact --exit-code 1

  npm-audit:
    name: npm dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Dependency list and npm audit
        run: |
          bash .github/scripts/ci-docker.sh node:22-bookworm-slim@sha256:4b150b48b4116e2a22f2c39cc27025fbf4f153e2078fd3b14d159fdb5c7279da . <<'SH'
          (cd typescript && npm ci)
          # No runtime dependencies reach a caller
          node .github/scripts/check-dependencies.mjs
          # The dev tree is audited at a level worth acting on.
          (cd typescript && npm audit --audit-level=high)
          SH

  pip-audit:
    name: Python dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Dependency list and pip-audit
        run: |
          bash .github/scripts/ci-docker.sh python:3.12-slim@sha256:aa943ce411423c7582288f18707ff66eddcbaeb510502d747a72aeb34f30d159 . <<'SH'
          pip install pip-audit
          # No runtime dependencies reach a caller
          python .github/scripts/check_dependencies.py
          # Audit what a contributor installs: the dev extra, resolved and pinned.
          # The package itself is installed editable and left out of the list:
          # pip-audit cannot look it up, and --strict turns that skip into a failure.
          pip install -e "./python[dev]"
          pip freeze --exclude-editable > /tmp/requirements-audit.txt
          pip-audit --strict --disable-pip --no-deps -r /tmp/requirements-audit.txt
          SH

  osv:
    name: OSV scanner
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # A second opinion on both lockfiles from a different advisory database.
      - name: osv-scanner
        run: docker run --rm -v "$PWD:/src" -w /src ghcr.io/google/osv-scanner:v2.7.0@sha256:4f3b7e2c64b9d38a5febc5a7e4a3dfef1d1362f726dea7a2ef4762b46469fcd0 scan source --recursive ./

  # The editions, on a seed nobody chose: random seed, ten times the cases. The
  # seed is printed, so anything it finds is reproducible.
  parity-fuzz:
    name: Editions agree (random seed)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build tool image
        run: docker build -q -t ci-polyglot:local .github/ci

      - name: Differential run, random seed
        run: |
          bash .github/scripts/ci-docker.sh ci-polyglot:local . <<'SH'
          (cd typescript && npm ci && npm run build)
          seed=$RANDOM
          echo "::notice::seed $seed"
          bash shared/tools/differential/parity.sh "$seed" 200000
          SH

  actions:
    name: Workflow hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Every workflow declares its permissions
        run: |
          failed=0
          for file in .github/workflows/*.yml; do
            grep -q '^permissions:' "$file" || { echo "::error file=$file::no top-level permissions: block"; failed=1; }
          done
          exit $failed

      - name: actionlint
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 -color
