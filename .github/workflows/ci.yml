name: CI

# Two editions that must agree, and a package that must survive being packaged.
#
# Every step here can fail, and none of them is allowed a `|| true`. A check
# that cannot fail is a green tick that says nothing.
#
# Public repository: runs on GitHub-hosted runners (free for public repositories;
# the organisation runner serves private repositories only). Pull
# requests are validated with a read-only token and without secrets; there is
# no pull_request_target anywhere. Tools run in pinned official images (see
# .github/scripts/ci-docker.sh).
#
# The Windows and macOS legs of the old matrix are gone: the own runner is
# Linux only. The libraries touch no filesystem and no clock, so the
# operating-system dimension bought little; it is not tested any more.
#
# What the jobs are for:
#   meta         one version everywhere, and both editions carrying their files
#   python       the primary edition, on every Python it claims to support
#   typescript   the second edition, on every Node it claims to support
#   vectors      the contract between the editions, checked for drift
#   parity       the editions compared on cases nobody wrote down
#   package      the artefacts a caller actually installs, installed and used
#   ci           one status check that fails whenever anything above did

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  # release.yml runs this workflow before it builds the release.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  meta:
    name: Repository consistency
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build the Node + Python tool image
        run: docker build -q -t ci-polyglot:local .github/ci

      - name: Versions, licence, changelog, surface
        run: |
          bash .github/scripts/ci-docker.sh ci-polyglot:local . <<'SH'
          # Both editions share one version number. A test suite cannot notice
          # that promise being broken.
          node .github/scripts/check-versions.mjs
          # LICENSE and CHANGELOG.md live at the root and are copied into each
          # edition; the copies are gitignored.
          node .github/scripts/sync-package-files.mjs
          node .github/scripts/sync-package-files.mjs --check
          # The shared vectors prove the editions agree about what they compute.
          # This is the other half: that they agree about what they *offer*.
          pip install -e ./python
          node .github/scripts/check-surface.mjs
          SH

  python:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Images pinned by digest; Dependabot cannot see a matrix, so bump by hand.
        include:
          - { python: "3.10", image: "python:3.10-slim@sha256:6ff506466f8b1e981719b468cc0023b8ef000b983cdec0eafe119d01f379e31d" }
          - { python: "3.11", image: "python:3.11-slim@sha256:673719e071ecf27434fd2635bbd8d00f49f4fdd81f243143438a42ced8bedf60" }
          - { python: "3.12", image: "python:3.12-slim@sha256:aa943ce411423c7582288f18707ff66eddcbaeb510502d747a72aeb34f30d159" }
          - { python: "3.13", image: "python:3.13-slim@sha256:2d44738ebf4ce5f63b9d9ea871e9c7cfdc0426f7b0c97cac915fd88ded1d86bb" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Lint, types, tests with coverage gate, examples
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          bash .github/scripts/ci-docker.sh "${IMAGE}" python <<'SH'
          pip install -e ".[dev]"
          ruff check src tests examples
          ruff format --check src tests examples
          mypy
          # The coverage gate lives in pyproject.toml.
          pytest --cov=economyworld --cov-report=term-missing --cov-report=xml
          # An example that does not run is documentation that lies.
          for example in examples/*.py; do
            echo "-- $example"
            PYTHONPATH=src python "$example" > /dev/null
          done
          SH

      - name: Upload coverage
        if: matrix.python == '3.13'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-python
          path: python/coverage.xml
          retention-days: 14

  typescript:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Node 20 is end-of-life and the test toolchain (Vitest 5) needs 22.12+.
        include:
          - { node: "22", image: "node:22-bookworm-slim@sha256:4b150b48b4116e2a22f2c39cc27025fbf4f153e2078fd3b14d159fdb5c7279da" }
          - { node: "24", image: "node:24-bookworm-slim@sha256:be8204d4bd327363357f532187b752ff62759c31bedf98e9e18fc08c9cbd605c" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Lint, types, tests with coverage gate, build
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          bash .github/scripts/ci-docker.sh "${IMAGE}" typescript <<'SH'
          # `npm ci` and not `npm install`: the lockfile is the point.
          npm ci
          npm run lint
          npm run typecheck
          npm run test:coverage
          npm run build
          SH

      - name: Upload coverage
        if: matrix.node == '22'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-typescript
          path: typescript/coverage/lcov.info
          retention-days: 14

  vectors:
    name: Shared vectors
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Regenerate
        run: |
          bash .github/scripts/ci-docker.sh node:22-bookworm-slim@sha256:4b150b48b4116e2a22f2c39cc27025fbf4f153e2078fd3b14d159fdb5c7279da typescript <<'SH'
          npm ci
          npm run build
          node scripts/generate-shared-vectors.mjs
          SH

      # shared/testcases/ is generated. If regenerating produces a different file
      # than the one in the repository, the behaviour of the library changed and
      # nobody wrote it down. That is a red build on purpose.
      - name: The vectors in the repository are the ones this code produces
        run: |
          if ! git diff --exit-code --stat -- shared/testcases; then
            echo "::error::Regenerating the shared vectors changed them."
            echo "::error::That means the behaviour of the library changed."
            echo "::error::Review the diff, record it in CHANGELOG.md with the"
            echo "::error::version bump CONTRIBUTING.md asks for, and commit the"
            echo "::error::regenerated files. Never regenerate to make a failing"
            echo "::error::test pass."
            git diff -- shared/testcases
            exit 1
          fi
          echo "ok - no drift"

  # The cases nobody wrote down: a fixed vector list only catches a regression in
  # something somebody already imagined.
  parity:
    name: The editions agree
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build the Node + Python tool image
        run: docker build -q -t ci-polyglot:local .github/ci

      - name: Differential run
        run: |
          bash .github/scripts/ci-docker.sh ci-polyglot:local . <<'SH'
          (cd typescript && npm ci && npm run build)
          bash shared/tools/differential/parity.sh 1 20000
          SH

  package:
    name: Packageable artefacts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build the Node + Python tool image
        run: docker build -q -t ci-polyglot:local .github/ci

      # Everything above runs against the source tree. None of it would notice a
      # broken `exports` map, a missing py.typed, or a dist that was never built.
      - name: Build, pack, install and use both artefacts
        run: |
          bash .github/scripts/ci-docker.sh ci-polyglot:local . <<'SH'
          node .github/scripts/sync-package-files.mjs
          (cd typescript && npm ci && npm run build && npm pack --pack-destination "$RUNNER_TEMP")
          npx --yes @arethetypeswrong/cli@0.18.5 --pack typescript
          bash .github/scripts/smoke-npm.sh
          (cd python && python -m pip install --upgrade pip build twine && python -m build --outdir "$RUNNER_TEMP/pydist")
          python -m twine check "$RUNNER_TEMP"/pydist/*
          python .github/scripts/check_wheel.py "$RUNNER_TEMP/pydist"
          bash .github/scripts/smoke-wheel.sh
          SH

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: distributables
          path: |
            .ci-tmp/*.tgz
            .ci-tmp/pydist/*
          retention-days: 14

  # One status check that stays named "CI" however the matrix changes.
  ci:
    name: CI
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [meta, python, typescript, vectors, parity, package]
    if: always()
    steps:
      - name: Verdict
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "upstream results: $RESULTS"
          for result in $RESULTS; do
            if [ "$result" != "success" ]; then
              echo "::error::a required job did not succeed"
              exit 1
            fi
          done
          echo "ok - everything green"
