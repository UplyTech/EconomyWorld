name: CI

# Two editions that must agree, and a package that must survive being published.
#
# Every step here can fail, and none of them is allowed a `|| true`. A check
# that cannot fail is a green tick that says nothing, and after a green tick
# that says nothing nobody looks any more.
#
# What the jobs are for:
#   meta         one version everywhere, and both editions carrying their files
#   python       the primary edition, on every Python it claims to support
#   typescript   the second edition, on every Node it claims to support
#   vectors      the contract between the editions, checked for drift
#   parity       the editions compared on cases nobody wrote down
#   package      the artefacts a caller actually installs, installed and used
#   ci           one required status check the branch protection can point at

on:
  push:
    branches: [main, develop, "release/**"]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
  # release.yml runs this workflow before it publishes anything. Without this
  # trigger the call there is a startup error - and only at tag time, where it
  # helps least.
  workflow_call:

permissions:
  contents: read

concurrency:
  # One run per branch. Somebody who pushes three times in a row needs the
  # result of the third, not of the first.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NPM_CONFIG_FUND: "false"
  NPM_CONFIG_AUDIT: "false"

jobs:
  # ---------------------------------------------------------------------------
  # Cheap, and it fails for reasons no test can see.
  # ---------------------------------------------------------------------------
  meta:
    name: Repository consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: "20"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Both editions share one version number. A test suite cannot notice that
      # promise being broken: both suites still pass while npm says 1.2.0 and
      # PyPI says 1.1.0.
      - name: One version everywhere
        run: node .github/scripts/check-versions.mjs

      # LICENSE and CHANGELOG.md live at the root and are copied into each
      # edition, because each published artefact has to carry its own. The
      # copies are gitignored, so on a fresh clone they are simply absent -
      # which is exactly the state a publish must not happen from.
      - name: Both editions carry the licence and the changelog
        run: |
          node .github/scripts/sync-package-files.mjs
          node .github/scripts/sync-package-files.mjs --check

      # The shared vectors prove the editions agree about what they compute.
      # Nothing proved they agree about what they *offer* - and a caller
      # porting a bot from Python to Node finds a missing function at the worst
      # possible moment. This also pins down the shape of a complete economy,
      # so a refactor cannot quietly drop a subsystem.
      - name: The editions expose the same economy
        env:
          PYTHON: python
        run: |
          pip install -e ./python
          node .github/scripts/check-surface.mjs

  # ---------------------------------------------------------------------------
  # The primary edition. The versions in the classifiers are a promise, and a
  # promise that is never run on is a guess.
  # ---------------------------------------------------------------------------
  python:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: python
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
        os: [ubuntu-latest]
        include:
          # The oldest and the newest supported version on the other two
          # platforms. A full matrix would buy almost nothing for a library
          # that touches no filesystem and no clock.
          - { python: "3.10", os: windows-latest }
          - { python: "3.13", os: windows-latest }
          - { python: "3.10", os: macos-latest }
          - { python: "3.13", os: macos-latest }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: python/pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff
        run: |
          ruff check src tests examples
          ruff format --check src tests examples

      - name: mypy --strict
        run: mypy

      # The gate lives in pyproject.toml.
      - name: Tests and coverage gate
        run: pytest --cov=economyworld --cov-report=term-missing --cov-report=xml

      # An example that does not run is documentation that lies.
      - name: Examples
        env:
          PYTHONPATH: src
        run: |
          for example in examples/*.py; do
            echo "-- $example"
            python "$example" > /dev/null
          done

      - name: Upload coverage
        if: matrix.python == '3.13' && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-python
          path: python/coverage.xml
          retention-days: 14

  # ---------------------------------------------------------------------------
  # The second edition. `engines` names the floor, so the floor is tested.
  # ---------------------------------------------------------------------------
  typescript:
    name: Node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: typescript
    strategy:
      fail-fast: false
      matrix:
        node: ["20", "22", "24"]
        os: [ubuntu-latest]
        include:
          - { node: "20", os: windows-latest }
          - { node: "24", os: windows-latest }
          - { node: "20", os: macos-latest }
          - { node: "24", os: macos-latest }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: typescript/package-lock.json

      # `npm ci` and not `npm install`: the lockfile is the point. It is also
      # the reason the lockfile is committed - see the note in .gitignore.
      - name: Install
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: TypeScript
        run: npm run typecheck

      - name: Tests and coverage gate
        run: npm run test:coverage

      - name: Build
        run: npm run build

      - name: Upload coverage
        if: matrix.node == '20' && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-typescript
          path: typescript/coverage/lcov.info
          retention-days: 14

  # ---------------------------------------------------------------------------
  # The contract between the editions.
  #
  # shared/testcases/ is generated. If regenerating produces a different file
  # than the one in the repository, the behaviour of the library changed and
  # nobody wrote it down. That is a red build on purpose.
  # ---------------------------------------------------------------------------
  vectors:
    name: Shared vectors
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: typescript/package-lock.json

      - run: npm ci
        working-directory: typescript

      - run: npm run build
        working-directory: typescript

      - name: Regenerate
        run: node scripts/generate-shared-vectors.mjs
        working-directory: typescript

      - name: The vectors in the repository are the ones this code produces
        run: |
          if ! git diff --exit-code --stat -- shared/testcases; then
            echo "::error::Regenerating the shared vectors changed them."
            echo "::error::That means the behaviour of the library changed."
            echo "::error::Review the diff, record it in CHANGELOG.md with the"
            echo "::error::version bump CONTRIBUTING.md asks for, and commit the"
            echo "::error::regenerated files. Never regenerate to make a failing"
            echo "::error::test pass."
            git diff -- shared/testcases
            exit 1
          fi
          echo "ok - no drift"

  # ---------------------------------------------------------------------------
  # The cases nobody wrote down.
  #
  # `vectors` above checks a fixed list. A fixed list catches a regression in
  # something somebody already imagined; it did not catch the applyPermille
  # divergence that lived through the whole of 1.x, because every vector used an
  # amount below a million and the disagreement begins above 2^53 / 1000. This
  # job generates the cases nobody thought of.
  # ---------------------------------------------------------------------------
  parity:
    name: The editions agree
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: typescript/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: npm ci
        working-directory: typescript

      - run: npm run build
        working-directory: typescript

      - name: Differential run
        env:
          PYTHON: python
        run: bash shared/tools/differential/parity.sh 1 20000

  # ---------------------------------------------------------------------------
  # What a caller installs.
  #
  # Everything above runs against the source tree. None of it would notice a
  # broken `exports` map, a missing py.typed, or a dist that was never built -
  # the three ways a package that passes every test is still unusable.
  # ---------------------------------------------------------------------------
  package:
    name: Publishable artefacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: typescript/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate the per-edition licence and changelog
        run: node .github/scripts/sync-package-files.mjs

      - name: Build and pack the npm package
        working-directory: typescript
        run: |
          npm ci
          npm run build
          npm pack --pack-destination "$RUNNER_TEMP"

      # Type resolution is the part of a dual-format package that breaks
      # quietly: the JavaScript loads, and only a consumer's `tsc` complains.
      - name: Types resolve for every consumer shape
        run: npx --yes @arethetypeswrong/cli@latest --pack typescript

      - name: Install the tarball and use it
        run: bash .github/scripts/smoke-npm.sh

      - name: Build the wheel and the sdist
        working-directory: python
        run: |
          python -m pip install --upgrade pip build twine
          python -m build --outdir "$RUNNER_TEMP/pydist"

      - name: The metadata PyPI will see
        run: python -m twine check "$RUNNER_TEMP"/pydist/*

      # A wheel without py.typed types as `Any` in every calling project, and
      # nothing in the test suite can tell.
      - name: The wheel carries py.typed and the licence
        run: python .github/scripts/check_wheel.py "$RUNNER_TEMP/pydist"

      - name: Install the wheel and use it
        run: bash .github/scripts/smoke-wheel.sh

      - uses: actions/upload-artifact@v4
        with:
          name: distributables
          path: |
            ${{ runner.temp }}/*.tgz
            ${{ runner.temp }}/pydist/*
          retention-days: 14

  # ---------------------------------------------------------------------------
  # One check to protect the branch with.
  #
  # A matrix job cannot be named in branch protection without pinning every
  # combination by hand, and the pinned list goes stale the first time the
  # matrix changes. This job stays named "CI" forever and fails whenever
  # anything above it did.
  # ---------------------------------------------------------------------------
  ci:
    name: CI
    runs-on: ubuntu-latest
    needs: [meta, python, typescript, vectors, parity, package]
    if: always()
    steps:
      - name: Verdict
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "upstream results: $RESULTS"
          for result in $RESULTS; do
            if [ "$result" != "success" ]; then
              echo "::error::a required job did not succeed"
              exit 1
            fi
          done
          echo "ok - everything green"
