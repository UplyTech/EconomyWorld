# Labels applied automatically from the files a pull request touches.
#
# The point is not tidiness: several of these are what the stale bot and the
# pull-request workflow filter on.

python:
  - changed-files:
      - any-glob-to-any-file: python/**

typescript:
  - changed-files:
      - any-glob-to-any-file: typescript/**

# A change to the vectors is a change to the behaviour of both editions.
shared-vectors:
  - changed-files:
      - any-glob-to-any-file: shared/**

# The mechanism the whole library rests on. Anything under it is worth a second
# reviewer, and it is always at least a minor version.
core:
  - changed-files:
      - any-glob-to-any-file:
          - python/src/economyworld/money.py
          - python/src/economyworld/ledger.py
          - python/src/economyworld/rounding.py
          - typescript/src/money.ts
          - typescript/src/ledger.ts
          - typescript/src/rounding.ts
          - typescript/src/exact.ts

# The modules that turn an amount into an obligation. A wrong number here is
# somebody's instalment, and it is wrong for the whole term.
financial:
  - changed-files:
      - any-glob-to-any-file:
          - python/src/economyworld/bank.py
          - python/src/economyworld/billing.py
          - python/src/economyworld/credit.py
          - python/src/economyworld/instruments.py
          - python/src/economyworld/interest.py
          - python/src/economyworld/market.py
          - python/src/economyworld/tax.py
          - typescript/src/bank.ts
          - typescript/src/billing.ts
          - typescript/src/credit.ts
          - typescript/src/instruments.ts
          - typescript/src/interest.ts
          - typescript/src/market.ts
          - typescript/src/tax.ts

documentation:
  - changed-files:
      - any-glob-to-any-file:
          - "**/*.md"
          - "**/examples/**"

ci:
  - changed-files:
      - any-glob-to-any-file: .github/**

tests:
  - changed-files:
      - any-glob-to-any-file:
          - python/tests/**
          - typescript/tests/**

# The harness that compares the editions on cases nobody wrote down.
differential:
  - changed-files:
      - any-glob-to-any-file: shared/tools/differential/**

dependencies:
  - changed-files:
      - any-glob-to-any-file:
          - typescript/package.json
          - typescript/package-lock.json
          - python/pyproject.toml
